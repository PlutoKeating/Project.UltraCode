name: Upstream Canary

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (read-only, zero git credentials persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: |
          bun install --cwd packages/plugin-gui --frozen-lockfile
          bun install --cwd packages/installer --frozen-lockfile

      - name: Install latest official OpenCode V2
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Run deterministic upstream probe and clean-room live host canary
        id: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bun run scripts/check-upstreams.ts \
            --verify-live \
            --out-json canary.json \
            --out-md canary-report.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload canary diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-canary-report
          path: |
            canary.json
            canary-report.md

      - name: Reconcile single deduplicated upstream-sync Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun - <<'EOF'
          import { execFileSync } from "node:child_process";
          import { existsSync, readFileSync } from "node:fs";

          if (!existsSync("canary.json") || !existsSync("canary-report.md")) {
            console.error("Canary output files missing; skipping issue reconciliation.");
            process.exit(1);
          }

          function gh(args: string[]): string {
            return execFileSync("gh", args, {
              encoding: "utf8",
              stdio: ["ignore", "pipe", "inherit"],
            });
          }

          gh([
            "label",
            "create",
            "upstream-sync",
            "--color",
            "E5A03D",
            "--description",
            "Automated upstream compatibility & version tracking",
            "--force",
          ]);

          const report = JSON.parse(readFileSync("canary.json", "utf8"));
          const canaryOk = report.canary ? Boolean(report.canary.ok) : true;
          const hasErrors = Boolean(report.hasErrors);
          const actionable = Boolean(report.hasUpdates || hasErrors || !canaryOk);
          const fingerprint = String(report.fingerprint || "");
          const updatedIds = Array.isArray(report.items)
            ? report.items
                .filter((i: { status?: string }) => i.status === "update-available")
                .map((i: { id?: string; latestVersion?: string }) => `${i.id}@${i.latestVersion}`)
                .join(", ")
            : "";

          let issueTitle = "Upstream Stewardship: ";
          if (!canaryOk) {
            issueTitle += `live opencode v${report.canary?.opencodeVersion || "latest"} canary failed`;
          } else if (hasErrors) {
            issueTitle += "upstream probe encountered API errors";
          } else if (updatedIds) {
            issueTitle += `updates available (${updatedIds})`;
          } else {
            issueTitle += "aligned";
          }
          issueTitle = issueTitle.replace(/[\r\n]+/g, " ").slice(0, 240);

          const openListRaw = gh([
            "issue",
            "list",
            "--state",
            "open",
            "--label",
            "upstream-sync",
            "--limit",
            "1",
            "--json",
            "number,body",
          ]);
          const openIssues = JSON.parse(openListRaw || "[]") as Array<{ number?: number; body?: string }>;
          const existingNumber = openIssues[0]?.number ? String(openIssues[0].number) : "";
          const existingBody = String(openIssues[0]?.body || "");
          const existingFp = existingBody.match(/ultracode-upstream-fingerprint:\s*([a-f0-9]+)/i)?.[1] || "";

          if (actionable) {
            if (!existingNumber) {
              gh([
                "issue",
                "create",
                "--title",
                issueTitle,
                "--label",
                "upstream-sync",
                "--body-file",
                "canary-report.md",
              ]);
            } else {
              gh([
                "issue",
                "edit",
                existingNumber,
                "--title",
                issueTitle,
                "--body-file",
                "canary-report.md",
              ]);
              if (existingFp !== fingerprint || !canaryOk) {
                gh([
                  "issue",
                  "comment",
                  existingNumber,
                  "--body",
                  `Updated upstream canary report (fingerprint: \`${fingerprint}\`, live host canary: \`${canaryOk ? "PASS" : "FAIL"}\`).`,
                ]);
              }
            }
          } else if (existingNumber) {
            gh([
              "issue",
              "comment",
              existingNumber,
              "--body",
              "All 4 monitored upstreams match `packages/config/upstream-baseline.json` and the clean-room live `opencode` canary passed. Closing automatically.",
            ]);
            gh(["issue", "close", existingNumber]);
          }

          if (!canaryOk || hasErrors) {
            process.exit(1);
          }
          EOF
