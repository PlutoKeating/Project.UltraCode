name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --cwd installer --frozen-lockfile
      - run: bun run build
        working-directory: installer
        env:
          ULTRACODE_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
      - name: Package native binary
        working-directory: installer
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mv dist/ultracode-current "dist/ultracode-$TARGET"
          rm -f dist/ultracode-current.sha256
          ./dist/ultracode-$TARGET version
          if command -v sha256sum >/dev/null; then
            sha256sum "dist/ultracode-$TARGET" > "dist/ultracode-$TARGET.sha256"
          else
            shasum -a 256 "dist/ultracode-$TARGET" > "dist/ultracode-$TARGET.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ultracode-${{ matrix.target }}
          path: installer/dist/ultracode-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: "artifacts/ultracode-*"
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.RELEASE_TAG }}" artifacts/ultracode-* --clobber
