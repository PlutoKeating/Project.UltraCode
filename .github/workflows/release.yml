name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --cwd packages/plugin-gui --frozen-lockfile
      - run: bun run --cwd packages/plugin-gui check
      - run: bun run --cwd packages/plugin-gui build
      - run: bun install --cwd packages/installer --frozen-lockfile
      - run: bun test --cwd packages/installer && bun run --cwd packages/installer check
      - name: Build six platforms and smoke-test the host binary
        env:
          ULTRACODE_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          bun run packages/installer/scripts/build.ts --release
          cd packages/installer/dist
          for f in ultracode-linux-x64 ultracode-linux-arm64 ultracode-darwin-x64 ultracode-darwin-arm64 ultracode-windows-x64.exe ultracode-windows-arm64.exe; do
            test -s "$f"
            test -s "$f.sha256"
          done
          test "$(./ultracode-linux-x64 version)" = "${RELEASE_TAG#v}" || test "$(./ultracode-linux-x64 version)" = "$RELEASE_TAG"
          sha256sum -c *.sha256
      - uses: actions/attest@v4
        with:
          subject-path: packages/installer/dist/ultracode-*
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" packages/installer/dist/ultracode-* --verify-tag --title "UltraCode $RELEASE_TAG" --generate-notes
