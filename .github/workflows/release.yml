name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --cwd installer --frozen-lockfile
      - run: bun test --cwd installer && bun run --cwd installer check
      - name: Build four platforms and smoke-test the host binary
        env:
          ULTRACODE_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          bun run installer/scripts/build.ts --release
          cd installer/dist
          test "$(./ultracode-linux-x64 version)" = "$RELEASE_TAG"
          sha256sum -c *.sha256
      - uses: actions/attest@v4
        with:
          subject-path: installer/dist/ultracode-*
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" installer/dist/ultracode-* --verify-tag --title "UltraCode $RELEASE_TAG" --generate-notes
