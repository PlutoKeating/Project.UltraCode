name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --cwd packages/plugin-gui --frozen-lockfile
      - run: bun run --cwd packages/plugin-gui check
      - run: bun run --cwd packages/plugin-gui build
      - run: bun install --cwd packages/installer --frozen-lockfile
      - run: bun test
        working-directory: packages/installer
      - run: bun run check
        working-directory: packages/installer
      - run: bun run build
        working-directory: packages/installer
      - if: runner.os != 'Windows'
        run: ./dist/ultracode-current version
        working-directory: packages/installer
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\ultracode-current.exe version
        working-directory: packages/installer
      - if: runner.os == 'Windows'
        name: Smoke-test install.ps1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\scripts\install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --cwd website --frozen-lockfile
      - run: bun run check
        working-directory: website
      - run: bun run build
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
