name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --cwd plugin-gui --frozen-lockfile
      - run: bun run --cwd plugin-gui check
      - run: bun run --cwd plugin-gui build
      - run: bun install --cwd installer --frozen-lockfile
      - run: bun test
        working-directory: installer
      - run: bun run check
        working-directory: installer
      - run: bun run build
        working-directory: installer
      - if: runner.os != 'Windows'
        run: ./dist/ultracode-current version
        working-directory: installer
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\ultracode-current.exe version
        working-directory: installer
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --cwd website --frozen-lockfile
      - run: bun run check
        working-directory: website
      - run: bun run build
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
